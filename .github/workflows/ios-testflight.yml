name: iOS signed build and TestFlight upload
on:
  push:
    branches: [ios-native-preparation]
    paths: ['.github/workflows/ios-testflight.yml', 'native/ios/scripts/QRPDF.swift']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15-intel
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      APP_BUNDLE_ID: it.dovelhomesso.casadolcecasa
      APPLE_TEAM_ID: 5VXCU47QVP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required credentials without displaying them
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          API_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for field in P12 P12_PASSWORD PROFILE API_P8 API_KEY_ID API_ISSUER_ID; do
            if [ -z "${!field}" ]; then echo "::error::Missing credential: $field"; exit 1; fi
          done
          umask 077
          printf '%s\n' "$API_P8" > "$RUNNER_TEMP/api-preflight.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/api-preflight.p8" -noout >/dev/null 2>&1; then
            rm -f "$RUNNER_TEMP/api-preflight.p8"
            echo "::error::APP_STORE_CONNECT_API_KEY_P8 must contain the complete original PEM text from the Apple .p8 file."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/api-preflight.p8"
      - name: Select installed Xcode 26 or later
        run: |
          set -euo pipefail
          xcode_path=$(find /Applications -maxdepth 1 -name 'Xcode_2*.app' | sort -V | tail -1)
          test -n "$xcode_path"
          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
      - name: Prepare bundled iOS project
        working-directory: native/ios
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run prepare:ios
          npm run check
          gem install --user-install xcodeproj --no-document
      - name: Verify populated position picker with WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/dlm-webkit" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/dlm-webkit/node_modules/playwright/cli.js" install webkit
          cd native/ios/www
          DLM_PLAYWRIGHT_MODULE="$RUNNER_TEMP/dlm-webkit/node_modules/playwright" node ../../../checks/iphone-place-picker.cjs
      - name: Install signing identity in temporary keychain
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import os, plistlib, datetime
          from pathlib import Path
          p=plistlib.loads((Path(os.environ['RUNNER_TEMP'])/'profile.plist').read_bytes())
          expected=os.environ['APPLE_TEAM_ID']+'.'+os.environ['APP_BUNDLE_ID']
          assert p['Entitlements']['application-identifier']==expected, 'Provisioning profile belongs to another app'
          assert p['TeamIdentifier']==[os.environ['APPLE_TEAM_ID']], 'Wrong Apple team'
          assert not p['Entitlements'].get('get-task-allow'), 'Development profile is not allowed'
          assert not p.get('ProvisionedDevices') and not p.get('ProvisionsAllDevices'), 'App Store distribution profile required'
          assert p['ExpirationDate']>datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Expired profile'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PROFILE_UUID='+p['UUID']+'\n')
              f.write('PROFILE_NAME='+p['Name']+'\n')
          print('Profile matches the app, team and App Store distribution method.')
          PY
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/dlm-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/dlm-signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/dlm-signing.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/dlm-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$RUNNER_TEMP/dlm-signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/dlm-signing.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$RUNNER_TEMP/dlm-signing.keychain-db" > "$RUNNER_TEMP/identities.txt"
          grep -q 'Apple Distribution:' "$RUNNER_TEMP/identities.txt" || { echo '::error::No valid Apple Distribution identity with private key'; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm "$RUNNER_TEMP/distribution.p12"
      - name: Configure application signing and export options
        working-directory: native/ios
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          ruby - <<'RUBY'
          require 'xcodeproj'
          project=Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target=project.targets.find { |t| t.name=='App' }
          abort 'App target missing' unless target
          target.build_configurations.each do |c|
            c.build_settings['DEVELOPMENT_TEAM']=ENV.fetch('APPLE_TEAM_ID')
            c.build_settings['CODE_SIGN_STYLE']='Manual'
            c.build_settings['CODE_SIGN_IDENTITY']='Apple Distribution'
            c.build_settings['PROVISIONING_PROFILE_SPECIFIER']=ENV.fetch('PROFILE_NAME')
            c.build_settings['MARKETING_VERSION']='1.0'
            c.build_settings['CURRENT_PROJECT_VERSION']="#{ENV.fetch('GITHUB_RUN_NUMBER')}.#{ENV.fetch('GITHUB_RUN_ATTEMPT')}"
          end
          project.save
          RUBY
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          options={'method':'app-store-connect','destination':'export','signingStyle':'manual',
            'teamID':os.environ['APPLE_TEAM_ID'],'signingCertificate':'Apple Distribution',
            'provisioningProfiles':{os.environ['APP_BUNDLE_ID']:os.environ['PROFILE_UUID']},
            'manageAppVersionAndBuildNumber':False,'uploadSymbols':True}
          (Path(os.environ['RUNNER_TEMP'])/'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
      - name: Archive signed app for physical iPhone and iPad
        working-directory: native/ios
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/DoveLhoMesso.xcarchive" archive > "$RUNNER_TEMP/dlm-archive.log" 2>&1 || { tail -100 "$RUNNER_TEMP/dlm-archive.log"; exit 1; }
          codesign --verify --deep --strict "$RUNNER_TEMP/DoveLhoMesso.xcarchive/Products/Applications/App.app"
      - name: Export App Store IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DoveLhoMesso.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/dlm-export" > "$RUNNER_TEMP/dlm-export.log" 2>&1 || { tail -100 "$RUNNER_TEMP/dlm-export.log"; exit 1; }
          ipa_path=$(find "$RUNNER_TEMP/dlm-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa_path"
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
      - name: Validate and upload build to App Store Connect
        env:
          API_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p private_keys
          printf '%s\n' "$API_P8" > "private_keys/AuthKey_$API_KEY_ID.p8"
          trap 'rm -rf private_keys' EXIT
          xcrun altool --validate-app -f "$IPA_PATH" --type ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/dlm-validate.log"
          if grep -q "ERROR:" "$RUNNER_TEMP/dlm-validate.log"; then exit 1; fi
          xcrun altool --upload-app -f "$IPA_PATH" --type ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/dlm-upload.log"
          if grep -q "ERROR:" "$RUNNER_TEMP/dlm-upload.log"; then exit 1; fi
          grep -Eqi "UPLOAD SUCCEEDED|No errors uploading" "$RUNNER_TEMP/dlm-upload.log" || { echo "::error::Apple upload success was not confirmed"; exit 1; }
          echo 'Signed build uploaded to App Store Connect. Apple processing and TestFlight availability are still pending. No App Review submission or public release performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve build diagnostics without signing credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-build-diagnostics
          path: |
            ${{ runner.temp }}/dlm-archive.log
            ${{ runner.temp }}/dlm-export.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/dlm-signing.keychain-db" || true
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/identities.txt"
          rm -rf private_keys
