name: App Store iPad screenshots
on:
  push:
    branches: [ios-native-preparation]
    paths: ['.github/workflows/ios-ipad-screenshots.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode_path=$(find /Applications -maxdepth 1 -name 'Xcode_2*.app' | sort -V | tail -1)
          test -n "$xcode_path"
          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"
      - name: Prepare the app and screenshot target
        working-directory: native/ios
        run: |
          npm ci --no-audit --no-fund
          npm run prepare:ios
          npm run check
          gem install --user-install xcodeproj -v 1.27.0 --no-document
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          ruby scripts/add-screenshot-tests.rb
          mkdir -p ios/App/StoreScreenshots
          cp scripts/StoreScreenshots.swift ios/App/StoreScreenshots/
      - name: Capture the app on a 13-inch iPad simulator
        working-directory: native/ios
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=[d for runtime, group in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in group if d["isAvailable"] and "iPad" in d["name"] and ("13-inch" in d["name"] or "12.9-inch" in d["name"])]; devices.sort(key=lambda d: ("Pro" in d["name"], "13-inch" in d["name"])); print(devices[-1]["udid"])')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl status_bar "$device_id" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcodebuild -project ios/App/App.xcodeproj -scheme StoreScreenshots -configuration Debug -destination "platform=iOS Simulator,id=$device_id" -parallel-testing-enabled NO -only-testing:StoreScreenshots/StoreScreenshots/testStoreScreenshots -resultBundlePath "$RUNNER_TEMP/iPad.xcresult" CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/ipad.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ipad.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipad-screenshots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/iPad.xcresult" --output-path "$RUNNER_TEMP/ipad-screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: ipad-app-store-screenshots
          path: ${{ runner.temp }}/ipad-screenshots
          if-no-files-found: error
          retention-days: 14
